<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dthh</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Google Fonts hỗ trợ tiếng Việt mềm mại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --night-top: #090d16;
            --night-mid: #161b33;
            --night-bottom: #2a2448;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(ellipse at bottom, var(--night-bottom) 0%, var(--night-mid) 45%, var(--night-top) 100%);
            color: #fff;
            user-select: none;
        }

        .font-script {
            font-family: 'Dancing Script', cursive;
        }

        /* Sao lấp lánh nền */
        .star {
            position: fixed;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            opacity: 0.2;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            }
        }

        @keyframes floatCloud {
            0%, 100% {
                transform: translateX(0px) translateY(0px);
            }
            50% {
                transform: translateX(15px) translateY(-6px);
            }
        }

        .cloud-float-1 {
            animation: floatCloud 7s ease-in-out infinite;
        }

        .cloud-float-2 {
            animation: floatCloud 9s ease-in-out infinite reverse;
        }

        @keyframes moonGlow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(254, 240, 138, 0.5));
                transform: rotate(-8deg) scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(254, 240, 138, 0.85));
                transform: rotate(-4deg) scale(1.03);
            }
        }

        .moon-animate {
            animation: moonGlow 6s ease-in-out infinite;
        }

        /* Rung lắc từng hộp quà */
        @keyframes giftWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-3.5deg) scale(1.03); }
            30% { transform: rotate(3.5deg) scale(1.03); }
            45% { transform: rotate(-2.5deg) scale(1.02); }
            60% { transform: rotate(2.5deg) scale(1.02); }
            75% { transform: rotate(-1deg) scale(1.01); }
        }

        .gift-wobble {
            animation: giftWobble var(--wobble-dur, 3s) ease-in-out infinite;
            animation-delay: var(--wobble-delay, 0s);
            transform-origin: bottom center;
        }

        .gift-wobble:hover {
            animation-play-state: paused;
            transform: scale(1.05);
            transition: transform 0.2s ease;
        }

        /* Trạng thái các hộp còn lại bị khóa sau khi đã dùng 1 lượt mở */
        .gift-card.locked {
            opacity: 0.45;
            filter: grayscale(0.45);
            transition: opacity 0.5s ease, filter 0.5s ease;
        }

        .gift-card.locked .gift-trigger {
            cursor: not-allowed;
        }

        .gift-card.locked .lock-badge {
            opacity: 1;
            transform: scale(1);
        }

        .lock-badge {
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Nắp hộp bật mở */
        .gift-lid {
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.55s ease;
            transform-origin: 90% 80%;
            z-index: 20;
        }

        .gift-card.opened .gift-lid {
            transform: translateY(-20px) translateX(48px) rotate(36deg) scale(0.86);
            opacity: 0.4;
            z-index: 10;
        }

        /* Hào quang khi mở */
        /* Pop-up lời chúc khi mở hộp (hiển thị nổi phía trên hộp để không làm giãn khoảng cách lưới) */
        .message-bubble {
            position: absolute;
            bottom: calc(100% - 10px);
            left: 50%;
            width: 168px;
            opacity: 0;
            transform: translateX(-50%) translateY(10px) scale(0.82);
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 40;
        }

        @media (min-width: 640px) {
            .message-bubble {
                width: 210px;
            }
        }

        .gift-card.opened .message-bubble {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
            pointer-events: auto;
        }

        .warm-text-glow {
            color: #9d174d;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.35), 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
        }

        /* Hiệu ứng nốt nhạc bay nhẹ khi đang phát */
        @keyframes musicBeat {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.18) rotate(-6deg); }
        }

        .music-playing .music-icon {
            display: inline-block;
            animation: musicBeat 1.2s ease-in-out infinite;
        }
    </style>
</head>

    <script>
        // 9 lời chúc ngủ ngon khác nhau (tổng 9 hộp)
        const GIFT_ITEMS = [
            {
                id: 'wish-1',
                isEmpty: false,

            },

            },
            {

            }
        ];

        // Bảng màu ruy băng & thân hộp
        const BOX_THEMES = [
            { lidFrom: '#FB7185', lidTo: '#E11D48', boxFrom: '#F43F5E', boxTo: '#BE123C', ribbon: '#FDE047', ribbonDark: '#FACC15' },
            { lidFrom: '#F472B6', lidTo: '#DB2777', boxFrom: '#EC4899', boxTo: '#9D174D', ribbon: '#FEF08A', ribbonDark: '#FDE047' },
            { lidFrom: '#A78BFA', lidTo: '#7C3AED', boxFrom: '#8B5CF6', boxTo: '#5B21B6', ribbon: '#FDE68A', ribbonDark: '#FCD34D' },
            { lidFrom: '#38BDF8', lidTo: '#0284C7', boxFrom: '#0EA5E9', boxTo: '#0369A1', ribbon: '#FEF08A', ribbonDark: '#FDE047' },
            { lidFrom: '#FBBF24', lidTo: '#D97706', boxFrom: '#F59E0B', boxTo: '#B45309', ribbon: '#FFFBEB', ribbonDark: '#FEF3C7' }
        ];

        // Xáo trộn mảng ngẫu nhiên bằng thuật toán Fisher–Yates
        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        // Tạo hiệu ứng bầu trời đầy sao lấp lánh
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            if (!starfield) return;
            starfield.innerHTML = '';
            const starCount = window.innerWidth < 640 ? 50 : 85;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.setProperty('--delay', `${Math.random() * 4}s`);
                starfield.appendChild(star);
            }
        }

        // Hệ thống hiệu ứng pháo giấy (Confetti)
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#F43F5E', '#FB7185', '#FDE047', '#FBBF24', '#C084FC', '#F9A8D4', '#67E8F9'];
        const shapes = ['circle', 'rect', 'heart', 'star'];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
                const speed = Math.random() * 7.5 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 1.5;
                this.gravity = 0.22;
                this.drag = 0.985;
                this.size = Math.random() * 7 + 5;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.shape = shapes[Math.floor(Math.random() * shapes.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.15;
                this.alpha = 1;
                this.decay = Math.random() * 0.01 + 0.007;
            }

            update() {
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.shape === 'rect') {
                    ctx.fillRect(-this.size * 0.5, -this.size * 0.3, this.size, this.size * 0.6);
                } else if (this.shape === 'heart') {
                    const s = this.size * 0.55;
                    ctx.beginPath();
                    ctx.moveTo(0, s * 0.3);
                    ctx.bezierCurveTo(-s, -s * 0.5, -s * 0.5, -s * 1.2, 0, -s * 0.5);
                    ctx.bezierCurveTo(s * 0.5, -s * 1.2, s, -s * 0.5, 0, s * 0.3);
                    ctx.fill();
                } else if (this.shape === 'star') {
                    this.drawStar(ctx, 0, 0, 5, this.size * 0.6, this.size * 0.25);
                }

                ctx.restore();
            }

            drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
                let rot = (Math.PI / 2) * 3;
                const step = Math.PI / spikes;
                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
                    rot += step;
                    ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }
        }

        function launchCelebration(originX, originY, count = 42) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(originX, originY));
            }
            if (!animationFrameId) {
                animateParticles();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);
            for (const p of particles) {
                p.update();
                p.draw(ctx);
            }
            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animateParticles);
            } else {
                animationFrameId = null;
            }
        }

        // Hệ thống phát file nhạc MP3 (nhac-ru.mp3)
        const lullabyAudio = document.getElementById('lullabyAudio');
        let isMusicPlaying = false;
        let userMutedMusic = false;

        function updateMusicUI() {
            const btn = document.getElementById('musicToggleBtn');
            const label = document.getElementById('musicStatusLabel');
            if (!btn || !label) return;

            if (isMusicPlaying) {
                btn.classList.add('music-playing', 'border-amber-300/50', 'bg-pink-500/25');
                label.textContent = 'Nhạc ru: Đang phát';
            } else {
                btn.classList.remove('music-playing', 'border-amber-300/50', 'bg-pink-500/25');
                label.textContent = 'Nhạc ru: Tắt';
            }
        }

        function hideMusicIntroModal() {
            const modal = document.getElementById('musicIntroModal');
            if (!modal) return;
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function startLullabyMusic() {
            if (!lullabyAudio) return;
            try {
                lullabyAudio.volume = 0.75;
                await lullabyAudio.play();
                isMusicPlaying = true;
                updateMusicUI();
            } catch (err) {
                console.warn('Không thể phát file nhac-ru.mp3 (hãy đảm bảo file nằm cùng thư mục với index.html):', err);
                const label = document.getElementById('musicStatusLabel');
                if (label) label.textContent = 'Thiếu file nhac-ru.mp3';
            }
        }

        function stopLullabyMusic() {
            if (!lullabyAudio) return;
            lullabyAudio.pause();
            isMusicPlaying = false;
            updateMusicUI();
        }

        // Render lưới 3x3 (9 hộp quà) với vị trí ngẫu nhiên & giới hạn 1 lượt mở duy nhất
        let chosenCardIndex = null;

        function showLockedToast() {
            // Không hiển thị bảng thông báo giữa màn hình
        }

        function lockOtherGifts(selectedIndex) {
            const allCards = document.querySelectorAll('#giftGrid .gift-card');
            allCards.forEach((otherCard, idx) => {
                if (idx !== selectedIndex) {
                    otherCard.classList.add('locked');
                    const otherTrigger = otherCard.querySelector('.gift-trigger');
                    const otherLabel = otherCard.querySelector('.box-label');
                    if (otherTrigger) {
                        otherTrigger.classList.remove('gift-wobble');
                        otherTrigger.setAttribute('aria-disabled', 'true');
                    }
                    if (otherLabel) {
                        otherLabel.textContent = `🔒 Hộp #${idx + 1}`;
                    }
                }
            });

            const statusSubtitle = document.getElementById('statusSubtitle');
            const turnFooterText = document.getElementById('turnFooterText');
            if (statusSubtitle) {
                statusSubtitle.textContent = 'Lượt mở quà hôm nay đã dùng rồi — tải lại trang để thử vận may lần sau nhé! ✨';
                statusSubtitle.classList.remove('text-indigo-200/90');
                statusSubtitle.classList.add('text-amber-200', 'font-semibold');
            }
            if (turnFooterText) {
                turnFooterText.innerHTML = '✨ Lượt mở quà hôm nay đã dùng rồi — tải lại trang để thử vận may lần sau nhé!';
            }
        }

        function renderShuffledGifts() {
            const grid = document.getElementById('giftGrid');
            grid.innerHTML = '';
            chosenCardIndex = null;

            const shuffledGifts = shuffleArray(GIFT_ITEMS);

            shuffledGifts.forEach((item, index) => {
                const theme = BOX_THEMES[index % BOX_THEMES.length];
                const card = document.createElement('div');
                card.className = 'gift-card relative flex flex-col items-center w-full max-w-[96px] sm:max-w-[116px] select-none';

                const bubbleStyle = item.isEmpty
                    ? 'from-slate-100 via-gray-100 to-slate-200 border-slate-300 text-slate-600'
                    : 'from-rose-50 via-amber-50 to-pink-100 border-pink-200 warm-text-glow';

                card.innerHTML = `
                    <!-- Thẻ lời chúc / thông báo hộp trống nổi phía trên hộp -->
                    <div class="message-bubble rounded-2xl bg-gradient-to-br ${bubbleStyle} border-2 p-2.5 sm:p-3 shadow-2xl text-center">
                        <div class="text-[10px] sm:text-[11px] font-bold uppercase tracking-wider ${item.isEmpty ? 'text-slate-400' : 'text-pink-400'} mb-0.5">
                            ${item.emoji} ${item.isEmpty ? 'Hộp trống' : 'Lời chúc'}
                        </div>
                        <p class="${item.isEmpty ? 'text-[11px] sm:text-xs font-semibold text-slate-600 leading-snug' : 'font-script text-lg sm:text-2xl font-bold leading-snug'}">
                            ${item.text}
                        </p>
                        <button type="button" data-action="close"
                                class="mt-1.5 px-2.5 py-0.5 rounded-full text-[10px] sm:text-[11px] font-semibold ${item.isEmpty ? 'bg-slate-200 hover:bg-slate-300 text-slate-700' : 'bg-pink-200/80 hover:bg-pink-300/80 text-rose-900'} transition">
                            Đóng lại
                        </button>
                    </div>

                    <!-- Hộp quà có thể bấm mở -->
                    <div role="button" tabindex="0" data-action="toggle" aria-label="Mở hộp quà số ${index + 1}"
                         style="--wobble-dur: ${(2.6 + (index % 4) * 0.35).toFixed(2)}s; --wobble-delay: ${(index * 0.2).toFixed(2)}s;"
                         class="gift-trigger gift-wobble relative w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center cursor-pointer">
                        
                        ${item.isEmpty ? '' : '<div class="inner-glow absolute -top-3 w-24 h-24 sm:w-28 sm:h-28 rounded-full pointer-events-none z-0"></div>'}

                        <!-- Huy hiệu ổ khóa khi hộp bị khóa -->
                        <div class="lock-badge absolute z-30 flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-slate-900/85 border border-white/25 text-amber-200 text-xs sm:text-sm shadow-lg pointer-events-none">
                            🔒
                        </div>

                        <!-- Nắp hộp -->
                        <div class="gift-lid absolute top-0 left-0 w-full pointer-events-none">
                            <svg viewBox="0 0 220 95" class="w-full h-auto drop-shadow-md">
                                <path d="M110 42 C85 10, 48 18, 65 42 C74 52, 98 46, 110 42 Z" fill="${theme.ribbon}" stroke="#D97706" stroke-width="2.5"/>
                                <path d="M110 42 C135 10, 172 18, 155 42 C146 52, 122 46, 110 42 Z" fill="${theme.ribbon}" stroke="#D97706" stroke-width="2.5"/>
                                <rect x="100" y="31" width="20" height="18" rx="6" fill="${theme.ribbonDark}" stroke="#B45309" stroke-width="2.5"/>
                                <rect x="18" y="44" width="184" height="34" rx="10" fill="url(#lid-${item.id}-${index})"/>
                                <rect x="96" y="44" width="28" height="34" fill="${theme.ribbon}"/>
                                <rect x="22" y="47" width="176" height="6" rx="3" fill="rgba(255,255,255,0.28)"/>
                                <defs>
                                    <linearGradient id="lid-${item.id}-${index}" x1="18" y1="44" x2="202" y2="78" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="${theme.lidFrom}"/>
                                        <stop offset="100%" stop-color="${theme.lidTo}"/>
                                    </linearGradient>
                                </defs>
                            </svg>
                        </div>

                        <!-- Thân hộp -->
                        <svg viewBox="0 0 220 140" class="w-full h-auto mt-5 sm:mt-6 drop-shadow-lg z-10">
                            <ellipse cx="110" cy="131" rx="76" ry="7" fill="rgba(9, 13, 22, 0.45)"/>
                            <rect x="28" y="22" width="164" height="104" rx="12" fill="url(#box-${item.id}-${index})"/>
                            <rect x="28" y="22" width="164" height="12" fill="rgba(0, 0, 0, 0.22)"/>
                            <rect x="34" y="28" width="10" height="90" rx="5" fill="rgba(255, 255, 255, 0.15)"/>
                            <rect x="96" y="22" width="28" height="104" fill="${theme.ribbon}"/>
                            <rect x="96" y="22" width="28" height="10" fill="rgba(180, 83, 9, 0.22)"/>
                            <rect x="28" y="62" width="164" height="22" fill="${theme.ribbonDark}"/>
                            <rect x="96" y="62" width="28" height="22" fill="${theme.ribbon}"/>
                            <defs>
                                <linearGradient id="box-${item.id}-${index}" x1="28" y1="22" x2="192" y2="126" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="${theme.boxFrom}"/>
                                    <stop offset="100%" stop-color="${theme.boxTo}"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>

                    <span class="box-label mt-0.5 text-[10px] sm:text-[11px] font-semibold text-amber-100/85">Hộp #${index + 1}</span>
                `;

                const trigger = card.querySelector('.gift-trigger');
                const closeMiniBtn = card.querySelector('[data-action="close"]');

                function setOpenedState(open) {
                    if (open) {
                        const isFirstTimeOpening = chosenCardIndex === null;
                        chosenCardIndex = index;
                        card.classList.add('opened');
                        trigger.classList.remove('gift-wobble');

                        if (isFirstTimeOpening) {
                            lockOtherGifts(index);
                            if (!userMutedMusic) {
                                startLullabyMusic();
                            }
                            if (!item.isEmpty) {
                                const rect = trigger.getBoundingClientRect();
                                launchCelebration(rect.left + rect.width / 2, rect.top + rect.height * 0.4, 42);
                            }
                        }
                    } else {
                        card.classList.remove('opened');
                    }
                }

                function handleBoxInteract() {
                    if (chosenCardIndex !== null && chosenCardIndex !== index) {
                        showLockedToast();
                        return;
                    }
                    const willOpen = !card.classList.contains('opened');
                    setOpenedState(willOpen);
                }

                trigger.addEventListener('click', handleBoxInteract);

                trigger.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        handleBoxInteract();
                    }
                });

                closeMiniBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    setOpenedState(false);
                });

                grid.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            createStarfield();
            renderShuffledGifts();

            const musicToggleBtn = document.getElementById('musicToggleBtn');
            if (musicToggleBtn) {
                musicToggleBtn.addEventListener('click', () => {
                    if (isMusicPlaying) {
                        userMutedMusic = true;
                        stopLullabyMusic();
                    } else {
                        userMutedMusic = false;
                        startLullabyMusic();
                    }
                });
            }

            const closeMusicModalBtn = document.getElementById('closeMusicModalBtn');
            if (closeMusicModalBtn) {
                closeMusicModalBtn.addEventListener('click', hideMusicIntroModal);
            }

            const enableMusicFromModalBtn = document.getElementById('enableMusicFromModalBtn');
            if (enableMusicFromModalBtn) {
                enableMusicFromModalBtn.addEventListener('click', async () => {
                    userMutedMusic = false;
                    await startLullabyMusic();
                    hideMusicIntroModal();
                });
            }
        });
    </script>
</body>
</html>
