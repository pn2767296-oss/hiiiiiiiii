<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc dth ngủ ngoan ✨</title>
    <!-- Tải Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tải Google Fonts hỗ trợ tiếng Việt mềm mại -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --night-top: #090d16;
            --night-mid: #161b33;
            --night-bottom: #2a2448;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(ellipse at bottom, var(--night-bottom) 0%, var(--night-mid) 45%, var(--night-top) 100%);
            color: #fff;
            user-select: none;
        }

        .font-script {
            font-family: 'Dancing Script', cursive;
        }

        /* Hiệu ứng sao lấp lánh nền */
        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
            opacity: 0.2;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.3);
                box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            }
        }

        /* Đám mây trôi bồng bềnh */
        @keyframes floatCloud {
            0%, 100% {
                transform: translateX(0px) translateY(0px);
            }
            50% {
                transform: translateX(15px) translateY(-6px);
            }
        }

        .cloud-float-1 {
            animation: floatCloud 7s ease-in-out infinite;
        }

        .cloud-float-2 {
            animation: floatCloud 9s ease-in-out infinite reverse;
        }

        /* Mặt trăng tỏa sáng nhẹ */
        @keyframes moonGlow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(254, 240, 138, 0.5));
                transform: rotate(-8deg) scale(1);
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(254, 240, 138, 0.85));
                transform: rotate(-4deg) scale(1.03);
            }
        }

        .moon-animate {
            animation: moonGlow 6s ease-in-out infinite;
        }

        /* Hiệu ứng rung lắc hộp quà thu hút sự chú ý */
        @keyframes giftWobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            15% { transform: rotate(-4deg) scale(1.03); }
            30% { transform: rotate(4deg) scale(1.03); }
            45% { transform: rotate(-3deg) scale(1.02); }
            60% { transform: rotate(3deg) scale(1.02); }
            75% { transform: rotate(-1deg) scale(1.01); }
        }

        .gift-wobble {
            animation: giftWobble 2.8s ease-in-out infinite;
            transform-origin: bottom center;
        }

        .gift-wobble:hover {
            animation-play-state: paused;
            transform: scale(1.05);
            transition: transform 0.25s ease;
        }

        /* Nắp hộp quà mở ra */
        .gift-lid {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
            transform-origin: 90% 80%;
            z-index: 30;
        }

        .gift-container.opened .gift-lid {
            transform: translateY(-20px) translateX(115px) rotate(38deg) scale(0.88);
            opacity: 0.35;
            z-index: 15;
        }

        /* Hào quang ấm áp bên trong hộp */
        .inner-glow {
            opacity: 0;
            transition: opacity 0.8s ease;
            background: radial-gradient(circle, rgba(255, 224, 130, 0.9) 0%, rgba(255, 167, 196, 0.4) 45%, transparent 75%);
        }

        .gift-container.opened .inner-glow {
            opacity: 1;
        }

        /* Tấm thiệp trồi lên từ bên trong hộp */
        .greeting-card {
            opacity: 0;
            transform: translateY(45px) scale(0.5);
            pointer-events: none;
            transition: all 0.9s cubic-bezier(0.22, 1, 0.36, 1);
            transition-delay: 0.12s;
            z-index: 20;
        }

        .gift-container.opened .greeting-card {
            opacity: 1;
            transform: translateY(-145px) scale(1);
            pointer-events: auto;
            z-index: 50;
        }

        @media (min-width: 640px) {
            .gift-container.opened .greeting-card {
                transform: translateY(-170px) scale(1);
            }
        }

        /* Hiệu ứng phát sáng chữ lời chúc */
        .warm-text-glow {
            color: #9d174d;
            text-shadow: 0 0 12px rgba(244, 114, 182, 0.45), 0 1px 2px rgba(255, 255, 255, 0.9);
        }

        /* Dòng hướng dẫn nhấp nháy nhẹ */
        @keyframes pulseHint {
            0%, 100% { opacity: 0.75; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .hint-pulse {
            animation: pulseHint 2.2s ease-in-out infinite;
        }

        /* Canvas pháo giấy */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
        }
    </style>
</head>
<body class="relative flex flex-col items-center justify-center min-h-screen px-4">

    <!-- Lớp nền sao lấp lánh -->
    <div id="starfield" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Canvas hiệu ứng pháo giấy, ngôi sao & trái tim bay tỏa -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Trang trí bầu trời: Mặt trăng khuyết & Đám mây dễ thương -->
    <div class="fixed top-6 right-6 sm:top-10 sm:right-14 pointer-events-none z-10">
        <!-- Mặt trăng khuyết SVG -->
        <svg class="w-20 h-20 sm:w-28 sm:h-28 moon-animate" viewBox="0 0 100 100" fill="none">
            <path d="M68 15C45.9086 15 28 32.9086 28 55C28 77.0914 45.9086 95 68 95C73.2 95 78.16 94 82.7 92.2C66.8 89.2 54.8 75.2 54.8 58.3C54.8 39.2 70.3 23.7 89.4 23.7C90.6 23.7 91.8 23.8 93 23.9C86.2 18.3 77.5 15 68 15Z" fill="#FEF08A"/>
            <!-- Sao nhỏ cạnh trăng -->
            <path d="M22 26L23.8 31.2L29 33L23.8 34.8L22 40L20.2 34.8L15 33L20.2 31.2L22 26Z" fill="#FDE047"/>
            <circle cx="80" cy="48" r="2" fill="#FEF9C3"/>
        </svg>
    </div>

    <!-- Đám mây 1 -->
    <div class="fixed top-16 left-4 sm:top-20 sm:left-16 opacity-35 pointer-events-none z-10 cloud-float-1">
        <svg class="w-28 h-14 sm:w-36 sm:h-18" viewBox="0 0 120 60" fill="none">
            <path d="M25 50H95C106.046 50 115 41.0457 115 30C115 19.6 107.06 11.06 96.9 10.1C93.2 4.05 86.56 0 79 0C69.4 0 61.3 6.45 58.8 15.25C56.1 13.8 53 13 49.7 13C39.6 13 31.3 20.7 30.3 30.55C28.6 30.2 26.8 30 25 30C13.9543 30 5 38.9543 5 50H25Z" fill="#C7D2FE"/>
        </svg>
    </div>

    <!-- Đám mây 2 -->
    <div class="fixed bottom-12 right-4 sm:bottom-16 sm:right-20 opacity-25 pointer-events-none z-10 cloud-float-2">
        <svg class="w-32 h-16 sm:w-44 sm:h-20" viewBox="0 0 120 60" fill="none">
            <path d="M25 50H95C106.046 50 115 41.0457 115 30C115 19.6 107.06 11.06 96.9 10.1C93.2 4.05 86.56 0 79 0C69.4 0 61.3 6.45 58.8 15.25C56.1 13.8 53 13 49.7 13C39.6 13 31.3 20.7 30.3 30.55C28.6 30.2 26.8 30 25 30C13.9543 30 5 38.9543 5 50H25Z" fill="#DDD6FE"/>
        </svg>
    </div>

    <!-- Khu vực trung tâm chứa Hộp Quà & Thiệp -->
    <main class="relative z-20 flex flex-col items-center justify-center w-full max-w-md mt-24 sm:mt-28">
        
        <!-- Vùng tương tác Hộp quà -->
        <div id="giftBox" role="button" tabindex="0" aria-label="Mở hộp quà"
             class="gift-container relative flex flex-col items-center justify-center cursor-pointer gift-wobble select-none">
            
            <!-- Tấm thiệp trồi lên từ bên trong hộp -->
            <div id="greetingCard"
                 class="greeting-card absolute w-[290px] sm:w-[340px] bg-gradient-to-br from-rose-50 via-amber-50 to-pink-100 rounded-3xl p-5 sm:p-6 shadow-[0_15px_45px_rgba(251,113,133,0.45)] border-2 border-pink-200/90 text-center">
                
                <!-- Icon trang trí đầu thiệp -->
                <div class="flex items-center justify-center gap-2 mb-2">
                    <span class="text-lg sm:text-xl">🌙</span>
                    <span class="text-xs font-bold uppercase tracking-widest text-pink-400">Gửi đến dth</span>
                    <span class="text-lg sm:text-xl">✨</span>
                </div>

                <!-- Lời chúc chính -->
                <h1 class="font-script text-3xl sm:text-4xl font-bold leading-snug warm-text-glow my-2">
                    Chúc dth ngủ ngoan ngoan hong mơ
                </h1>

                <!-- Dòng trang trí nhỏ ấm áp -->
                <div class="flex items-center justify-center gap-1.5 mt-3 text-pink-400 text-sm">
                    <span>🧸</span>
                    <span class="w-12 h-[1.5px] bg-pink-200 rounded-full"></span>
                    <span>💤</span>
                    <span class="w-12 h-[1.5px] bg-pink-200 rounded-full"></span>
                    <span>💖</span>
                </div>
            </div>

            <!-- Hào quang ấm áp tỏa ra khi mở nắp -->
            <div class="inner-glow absolute -top-10 w-56 h-56 rounded-full pointer-events-none z-10"></div>

            <!-- Hộp quà vẽ bằng SVG sắc nét & dễ thương -->
            <div class="relative w-44 h-44 sm:w-52 sm:h-52 flex items-center justify-center">
                
                <!-- Nắp hộp quà + Nơ (Tách riêng để tạo hiệu ứng bật mở) -->
                <div class="gift-lid absolute top-1 left-0 w-full pointer-events-none">
                    <svg viewBox="0 0 220 95" class="w-full h-auto drop-shadow-md">
                        <!-- Nơ bên trái -->
                        <path d="M110 42 C85 10, 48 18, 65 42 C74 52, 98 46, 110 42 Z" fill="#FDE047" stroke="#F59E0B" stroke-width="2.5"/>
                        <!-- Nơ bên phải -->
                        <path d="M110 42 C135 10, 172 18, 155 42 C146 52, 122 46, 110 42 Z" fill="#FDE047" stroke="#F59E0B" stroke-width="2.5"/>
                        <!-- Nút thắt nơ ở giữa -->
                        <rect x="100" y="31" width="20" height="18" rx="6" fill="#FACC15" stroke="#D97706" stroke-width="2.5"/>
                        
                        <!-- Thân nắp hộp -->
                        <rect x="18" y="44" width="184" height="34" rx="10" fill="url(#lidGrad)"/>
                        <!-- Ruy băng dọc trên nắp -->
                        <rect x="96" y="44" width="28" height="34" fill="#FDE047"/>
                        <!-- Viền sáng tạo khối 3D -->
                        <rect x="22" y="47" width="176" height="6" rx="3" fill="rgba(255,255,255,0.3)"/>
                        
                        <defs>
                            <linearGradient id="lidGrad" x1="18" y1="44" x2="202" y2="78" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FB7185"/>
                                <stop offset="100%" stop-color="#E11D48"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>

        <!-- Khu vực chuyển đổi giữa Dòng hướng dẫn & Nút Đóng hộp quà -->
        <div class="relative mt-6 min-h-[48px] flex items-center justify-center w-full">
            <!-- Dòng hướng dẫn mở quà -->
            <p id="hintText" class="text-base sm:text-lg font-medium text-amber-100/95 tracking-wide hint-pulse text-center transition-all duration-300">
                Chạm để mở hộp quà nhé ✨
            </p>

            <!-- Nút Đóng hộp quà (Thay thế vị trí dòng hướng dẫn khi mở) -->
            <button id="closeBtn" type="button"
                    class="absolute px-6 py-2.5 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 backdrop-blur-md border border-white/25 text-pink-100 font-semibold text-sm sm:text-base shadow-lg transition-all duration-300 opacity-0 pointer-events-none translate-y-2">
                Đóng hộp quà 🎁
            </button>
        </div>

    </main>

    <script>
        // 1. Tạo bầu trời đêm đầy sao lung linh ngẫu nhiên
        function createStarfield() {
            const starfield = document.getElementById('starfield');
            const starCount = window.innerWidth < 640 ? 55 : 95;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const size = Math.random() * 2.6 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.setProperty('--delay', `${Math.random() * 4}s`);
                
                starfield.appendChild(star);
            }
        }

        // 2. Hệ thống hiệu ứng Confetti, Trái tim & Ngôi sao bay tỏa
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const colors = ['#F43F5E', '#FB7185', '#FDE047', '#FBBF24', '#C084FC', '#F9A8D4', '#67E8F9'];
        const shapes = ['circle', 'rect', 'heart', 'star'];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
                const speed = Math.random() * 9 + 5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 2;
                this.gravity = 0.22;
                this.drag = 0.985;
                this.size = Math.random() * 8 + 6;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.shape = shapes[Math.floor(Math.random() * shapes.length)];
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.15;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.006;
            }

            update() {
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.alpha -= this.decay;
            }

            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;

                if (this.shape === 'circle') {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size * 0.45, 0, Math.PI * 2);
                    ctx.fill();
                } else if (this.shape === 'rect') {
                    ctx.fillRect(-this.size * 0.5, -this.size * 0.3, this.size, this.size * 0.6);
                } else if (this.shape === 'heart') {
                    const s = this.size * 0.55;
                    ctx.beginPath();
                    ctx.moveTo(0, s * 0.3);
                    ctx.bezierCurveTo(-s, -s * 0.5, -s * 0.5, -s * 1.2, 0, -s * 0.5);
                    ctx.bezierCurveTo(s * 0.5, -s * 1.2, s, -s * 0.5, 0, s * 0.3);
                    ctx.fill();
                } else if (this.shape === 'star') {
                    this.drawStar(ctx, 0, 0, 5, this.size * 0.6, this.size * 0.25);
                }

                ctx.restore();
            }

            drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
                let rot = (Math.PI / 2) * 3;
                let x = cx;
                let y = cy;
                const step = Math.PI / spikes;

                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;

                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fill();
            }
        }

        function launchCelebration(originX, originY) {
            for (let i = 0; i < 75; i++) {
                particles.push(new Particle(originX, originY));
            }
            if (!animationFrameId) {
                animateParticles();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.alpha > 0);

            for (const p of particles) {
                p.update();
                p.draw(ctx);
            }

            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animateParticles);
            } else {
                animationFrameId = null;
            }
        }

        // 3. Xử lý tương tác Mở / Đóng hộp quà
        const giftBox = document.getElementById('giftBox');
        const hintText = document.getElementById('hintText');
        const closeBtn = document.getElementById('closeBtn');
        let isOpened = false;

        function openGift() {
            if (isOpened) return;
            isOpened = true;

            // Dừng rung lắc và bật nắp + trồi thiệp
            giftBox.classList.remove('gift-wobble');
            giftBox.classList.add('opened');

            // Ẩn dòng hướng dẫn
            hintText.style.opacity = '0';
            hintText.style.pointerEvents = 'none';

            // Hiện nút Đóng hộp quà
            setTimeout(() => {
                closeBtn.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-2');
                closeBtn.classList.add('opacity-100', 'translate-y-0');
            }, 450);

            // Bắn pháo giấy từ vị trí hộp quà
            const rect = giftBox.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height * 0.45;
            launchCelebration(originX, originY);
        }

        function closeGift() {
            if (!isOpened) return;
            isOpened = false;

            // Thu thiệp và đóng nắp
            giftBox.classList.remove('opened');
            
            // Ẩn nút Đóng
            closeBtn.classList.add('opacity-0', 'pointer-events-none', 'translate-y-2');
            closeBtn.classList.remove('opacity-100', 'translate-y-0');

            // Khôi phục rung lắc và hướng dẫn sau khi nắp đóng xong
            setTimeout(() => {
                if (!isOpened) {
                    giftBox.classList.add('gift-wobble');
                    hintText.style.opacity = '1';
                    hintText.style.pointerEvents = 'auto';
                }
            }, 650);
        }

        giftBox.addEventListener('click', openGift);
        giftBox.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openGift();
            }
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeGift();
        });

        // Khởi tạo bầu trời sao khi tải trang
        window.addEventListener('DOMContentLoaded', createStarfield);
    </script>
</body>
</html>
